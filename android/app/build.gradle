plugins {
    id 'com.android.application'
}

// CI passes the run number as the version code (so every build installs over the last one); a local build uses 1
def rocketVersionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def rocketVersionName = System.getenv("ROCKET_VERSION_NAME") ?: "1.0"
def haveKeystore = System.getenv("ROCKET_KEYSTORE") != null

android {
    namespace "com.motovar.rocket"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.motovar.rocket"
        minSdk 21
        targetSdk 34
        versionCode rocketVersionCode
        versionName rocketVersionName

        ndk {
            // 64-bit phones, older 32-bit phones, and the x86_64 emulator
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-21"
            }
        }
    }

    signingConfigs {
        ci {
            if (haveKeystore) {
                storeFile file(System.getenv("ROCKET_KEYSTORE"))
                storePassword System.getenv("ROCKET_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ROCKET_KEY_ALIAS")
                keyPassword System.getenv("ROCKET_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig haveKeystore ? signingConfigs.ci : signingConfigs.debug
        }
        debug {
            // the game is real-time: keep the native code optimised in a debug build too
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
